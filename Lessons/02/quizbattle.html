<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QuizBattle</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; font-family: system-ui, sans-serif; background: linear-gradient(135deg, #ff6b35, #f7931e, #ffd700, #fff); background-size: 400% 400%; animation: gradient 15s ease infinite; color: #fff; display: flex; justify-content: center; }
@keyframes gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
#app { width: 100%; max-width: 900px; padding: 20px; }
.screen { display: none; }
.screen.active { display: block; }
.center { text-align: center; padding: 40px 20px; }
.logo { font-size: 60px; margin-bottom: 20px; }
h1 { font-size: 36px; margin-bottom: 10px; color: #333; }
.sub { color: #555; margin-bottom: 30px; }
.setup { max-width: 400px; margin: 0 auto; text-align: left; }
.setup-title { font-weight: bold; margin-bottom: 10px; color: #333; }
.mode-row { display: flex; gap: 10px; margin-bottom: 20px; }
.mode-btn { flex: 1; padding: 20px; background: #333; border: 3px solid #444; color: #fff; border-radius: 10px; cursor: pointer; font-size: 18px; font-weight: bold; }
.mode-btn.active { border-color: #ff6b35; background: #ff6b35; }
.time-card { background: #222; padding: 20px; border-radius: 12px; }
.time-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.time-value { background: #ff6b35; color: #fff; padding: 5px 15px; border-radius: 20px; font-weight: bold; }
#time-range { width: 100%; }
.chips { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 15px; }
.chip { padding: 10px 20px; background: #333; border: none; color: #fff; border-radius: 20px; cursor: pointer; font-size: 16px; }
.chip.active { background: #ff6b35; }
.hint { color: #555; font-size: 14px; margin-top: 20px; line-height: 1.5; }
.big-btn { width: 100%; padding: 22px; background: #4caf50; border: none; color: #fff; font-size: 24px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 20px; }
.big-btn:hover { background: #45a049; }
.gamebar { margin-bottom: 15px; }
.small-btn { padding: 10px 20px; background: #333; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-size: 16px; }
.panel { background: #222; border-radius: 12px; padding: 20px; }
.topbar { display: flex; justify-content: space-between; margin-bottom: 15px; }
.pill { background: #333; padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 16px; }
.pill.score { background: #ff6b35; }
.pill.time { min-width: 80px; text-align: center; }
.progress { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin-bottom: 10px; }
.progress > div { height: 100%; background: #4caf50; transition: width 0.3s; }
.question-box { background: #fff; color: #000; padding: 20px; border-radius: 12px; font-size: 22px; font-weight: bold; text-align: center; margin-bottom: 20px; min-height: 80px; display: flex; align-items: center; justify-content: center; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ans { padding: 18px; background: #333; border: none; color: #fff; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; }
.ans:hover { background: #444; }
.ans.c0 { background: #e91e63; }
.ans.c1 { background: #2196f3; }
.ans.c2 { background: #ff9800; }
.ans.c3 { background: #4caf50; }
.ans:disabled { opacity: 0.5; cursor: not-allowed; }
.ans.right { background: #4caf50 !important; }
.ans.wrong { background: #e91e63 !important; }
.feedback { margin-top: 15px; text-align: center; }
.fb-text { padding: 15px; border-radius: 8px; font-weight: bold; font-size: 18px; }
.fb-text.ok { background: #4caf50; }
.fb-text.bad { background: #e91e63; }
.result { text-align: center; padding: 20px; }
.result-score { font-size: 48px; font-weight: bold; color: #e91e63; }
.result-title { font-size: 24px; margin: 15px 0; color: #333; }
.result-text { color: #555; }
.confetti { position: fixed; top: -20px; width: 10px; height: 15px; animation: fall 3s linear forwards; }
@keyframes fall { to { transform: translateY(110vh) rotate(720deg); opacity: 0; } }
.brick { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #111; color: #fff; display: flex; justify-content: center; align-items: center; font-size: 24px; z-index: 1000; }
.brick-inner { background: #222; padding: 40px; border-radius: 12px; text-align: center; max-width: 400px; }
.dino-canvas { background: #87ceeb; border-radius: 12px; }
.dino-game { text-align: center; padding: 20px; }
.dino-game h2 { color: #333; }
.dino-game p { color: #555; }
.dino-btn { padding: 15px 30px; background: #4caf50; border: none; color: #fff; font-size: 20px; font-weight: bold; border-radius: 8px; cursor: pointer; margin: 5px; }
.dino-btn:hover { background: #45a049; }
.lives { position: fixed; top: 20px; right: 20px; font-size: 24px; color: #333; background: #fff; padding: 10px 15px; border-radius: 10px; z-index: 100; }
.game-over { text-align: center; padding: 40px; }
.win-message { color: #4caf50; font-size: 28px; font-weight: bold; }
.lose-message { color: #e91e63; font-size: 28px; font-weight: bold; }
</style>
</head>
<body>
<div id="app">
  <div class="lives" id="lives-display">❤️❤️❤️</div>
  
  <!-- Стартовый экран -->
  <section id="screen-start" class="screen active">
    <div class="center">
      <div class="logo">🎮</div>
      <h1>QuizBattle</h1>
      <p class="sub">5 вопросов. Чем быстрее ответ, тем больше очков!</p>
      
      <div class="setup">
        <div class="setup-title">Режим игры</div>
        <div class="mode-row">
          <button class="mode-btn active" id="btn-mode-solo" type="button">👤 Один игрок</button>
          <button class="mode-btn" id="btn-mode-duel" type="button">⚔️ Дуэль</button>
        </div>
        
        <div class="time-card">
          <div class="time-head">
            <span>⏱ Время на вопрос</span>
            <span class="time-value" id="time-value">30 сек</span>
          </div>
          <input type="range" id="time-range" min="5" max="300" step="5" value="30">
          <div class="chips" id="presets"></div>
        </div>
      </div>
      
      <p class="hint">За верный ответ: до 1000 очков. Ошибка = -100 очков (мин. 0).<br>3+ правильных = лёгкая игра (динозаврик). ≤2 правильных = теряем жизнь. 0 жизней = кирпич.</p>
      <button class="big-btn" id="btn-start" type="button">Поехали!</button>
    </div>
  </section>

  <!-- Игровой экран -->
  <section id="screen-game" class="screen">
    <div class="gamebar"><button class="small-btn" id="btn-menu" type="button">← Меню</button></div>
    <div id="banner"></div>
    <div id="arena"></div>
  </section>
</div>

<script>
(function() {
  var QUESTIONS = [
    { q: "Какой мой любимый цвет?", a: ["Красный", "Синий", "Чёрный", "Оранжевый"], c: 3 },
    { q: "Какая моя любимая аудиокнига?", a: ["Гарри Поттер", "Как приручить дракона", "Приключения семейки из Шербура", "Алиса в Стране чудес"], c: 0 },
    { q: "Какая моя любимая игра?", a: ["Minecraft", "Roblox", "Dors Paradox", "Portal 2"], c: 0 },
    { q: "Сколько мне лет?", a: ["9", "10", "11", "8"], c: 1 },
    { q: "Какая моя позиция в футболе?", a: ["Защитник", "Вратарь", "Нападающий", "Полузащитник"], c: 0 }
  ];
  
  var MAX_POINTS = 1000;
  var SHAPES = ["▲", "◆", "●", "■"];
  var BAD_TEXTS = ["Не угадал 😅", "Мимо! 💪", "Почти 🙈", "Не-а 🤷", "Увы 😄"];
  
  var lives = parseInt(localStorage.getItem("quizbattle_lives") || "3", 10);
  
  function updateLivesDisplay() {
    var el = document.getElementById("lives-display");
    if (el) {
      el.textContent = "❤️".repeat(Math.max(0, lives));
      if (lives <= 0) el.textContent = "💀";
    }
  }
  
  function $(id) { return document.getElementById(id); }
  function el(tag, cls, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html) e.innerHTML = html;
    return e;
  }
  function showScreen(name) {
    document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
    $("screen-" + name).classList.add("active");
  }
  function fmtTime(s) { return s < 60 ? s + " сек" : Math.floor(s/60) + " мин " + (s%60) + " сек"; }
  
  var arena = $("arena");
  var banner = $("banner");
  var rangeEl = $("time-range");
  var timeValueEl = $("time-value");
  var presetsBox = $("presets");
  var panels = [];
  var settings = { mode: "solo", time: 30 };
  var PRESETS = [5, 10, 20, 30, 60, 120, 300];
  
  function syncSetup() {
    rangeEl.value = settings.time;
    $("time-value").textContent = fmtTime(settings.time);
    document.querySelectorAll(".chip").forEach(function(c) { c.classList.toggle("active", parseInt(c.dataset.sec) === settings.time); });
    $("btn-mode-solo").classList.toggle("active", settings.mode === "solo");
    $("btn-mode-duel").classList.toggle("active", settings.mode === "duel");
  }
  
  function buildPresets() {
    PRESETS.forEach(function(sec) {
      var b = el("button", "chip", fmtTime(sec));
      b.type = "button"; b.dataset.sec = sec;
      b.addEventListener("click", function() { settings.time = sec; syncSetup(); });
      presetsBox.appendChild(b);
    });
  }
  
  function show(name) {
    document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
    $("screen-" + name).classList.add("active");
  }
  
  function clearGame() {
    panels.forEach(function(p) { if (p.destroy) p.destroy(); });
    panels = [];
    arena.innerHTML = "";
    banner.innerHTML = "";
  }
  
  function toMenu() { clearGame(); show("start"); }
  
  function createPanel(cfg) {
    var N = QUESTIONS.length;
    var LIMIT_MS = (cfg.timeLimit || 30) * 1000;
    var idx = 0, score = 0, correct = 0, locked = false, done = false;
    var timerId = null, deadline = 0;
    
    var root = el("div", "panel");
    if (cfg.color) root.style.border = "3px solid " + cfg.color;
    
    var quiz = el("div");
    var top = el("div", "topbar");
    if (cfg.name) {
      var namePill = el("div", "pill", cfg.name);
      namePill.style.background = cfg.color;
      top.appendChild(namePill);
    }
    var counter = el("div", "pill");
    var timePill = el("div", "pill time");
    var scoreEl = el("div", "pill score", "Счёт: 0");
    top.appendChild(counter); top.appendChild(timePill); top.appendChild(scoreEl);
    
    var prog = el("div", "progress");
    var progBar = el("div");
    prog.appendChild(progBar);
    var tbar = el("div", "timebar");
    var timeFill = el("div");
    var timeLabel = el("span", "timelabel");
    tbar.appendChild(timeFill); tbar.appendChild(timeLabel);
    
    var qbox = el("div", "question-box");
    var answers = el("div", "answers");
    var fb = el("div", "feedback");
    var fbText = el("div", "fb-text");
    var nextBtn = el("button", "big-btn", "Дальше");
    nextBtn.addEventListener("click", nextQuestion);
    fb.appendChild(fbText); fb.appendChild(nextBtn);
    
    quiz.appendChild(top); quiz.appendChild(prog);
    quiz.appendChild(tbar); quiz.appendChild(qbox); quiz.appendChild(answers); quiz.appendChild(fb);
    
    var res = el("div", "result");
    var rScore = el("div", "result-score");
    var rTitle = el("div", "result-title");
    var rText = el("p", "result-text");
    res.appendChild(rScore); res.appendChild(rTitle); res.appendChild(rText);
    res.style.display = "none";
    
    root.appendChild(quiz); root.appendChild(res);
    
    function setScore() { scoreEl.textContent = "Счёт: " + score; }
    function pointsFor(ms) {
      var frac = Math.max(0, Math.min(1, ms / LIMIT_MS));
      return Math.round(frac * MAX_POINTS);
    }
    
    function render() {
      locked = false;
      var item = QUESTIONS[idx];
      counter.textContent = "Вопрос " + (idx+1) + " из " + N;
      progBar.style.width = (idx/N*100) + "%";
      qbox.textContent = item.q;
      fb.style.display = "none";
      
      answers.innerHTML = "";
      item.a.forEach(function(ans, i) {
        var b = el("button", "ans c" + i, SHAPES[i] + " " + ans);
        b.type = "button";
        b.addEventListener("click", function() { choose(i); });
        answers.appendChild(b);
      });
      nextBtn.textContent = (idx === N-1) ? "Результат" : "Дальше";
      startTimer();
    }
    
    function startTimer() {
      if (timerId) clearInterval(timerId);
      deadline = Date.now() + LIMIT_MS;
      updateTimer();
      timerId = setInterval(updateTimer, 50);
    }
    function updateTimer() {
      var left = deadline - Date.now();
      if (left <= 0) { clearInterval(timerId); timeUp(); return; }
      var sec = Math.ceil(left/1000);
      var frac = left / LIMIT_MS;
      timeFill.style.width = (frac*100) + "%";
      timeLabel.textContent = "⚡ +" + pointsFor(left);
    }
    function timeUp() {
      if (locked || done) return;
      locked = true; reveal(-1);
      fbText.className = "fb-text bad";
      fbText.textContent = "Время вышло! ⏰";
      fb.style.display = "block";
    }
    function reveal(chosen) {
      var item = QUESTIONS[idx];
      var btns = answers.querySelectorAll(".ans");
      btns.forEach(function(b, k) {
        b.disabled = true;
        if (k === item.c) b.classList.add("right");
        else if (k === chosen) b.classList.add("wrong");
        else b.style.opacity = "0.3";
      });
    }
    function choose(i) {
      if (locked || done) return;
      var left = deadline - Date.now();
      if (left <= 0) { clearInterval(timerId); timeUp(); return; }
      locked = true; clearInterval(timerId);
      var ok = (i === QUESTIONS[idx].c);
      reveal(i);
      if (ok) {
        var pts = pointsFor(left);
        score += pts; correct++;
        fbText.className = "fb-text ok";
        fbText.textContent = "Верно! +" + pts + " очков";
      } else {
        score = Math.max(0, score - 100);
        fbText.className = "fb-text bad";
        fbText.textContent = "-100 " + BAD_TEXTS[idx % BAD_TEXTS.length];
      }
      fb.style.display = "block";
    }
    function nextQuestion() {
      if (!locked || done) return;
      idx++;
      if (idx >= QUESTIONS.length) finish(); else render();
    }
    function finish() {
      done = true; clearInterval(timerId);
      var correctCount = correct;
      
      if (cfg.onFinish) cfg.onFinish(score, correctCount);
      
      var rScore = root.querySelector(".result-score");
      var rTitle = root.querySelector(".result-title");
      var rText = root.querySelector(".result-text");
      
      rScore.textContent = score;
      if (correctCount >= 5) { rTitle.textContent = "🏆 Супер!"; rText.textContent = "Ты знаешь обо всём!"; }
      else if (correctCount >= 4) { rTitle.textContent = "🥳 Отлично!"; rText.textContent = "Всего одна ошибка!"; }
      else if (correctCount >= 3) { rTitle.textContent = "😎 Хорошо!"; rText.textContent = "Больше половины верно!"; }
      else if (correctCount >= 2) { rTitle.textContent = "🤔 Знакомимся"; rText.textContent = "Есть над чем поработать"; }
      else { rTitle.textContent = "🙈 Не знаю"; rText.textContent = "Попробуй ещё раз!"; }
      
      quiz.style.display = "none"; res.style.display = "block";
      
      if (correctCount >= 3) {
        setTimeout(function() { startDinoGame(); }, 1500);
      }
      
      if (correctCount <= 2) {
        loseLife();
      }
    }
    
    render();
    return {
      root: root,
      destroy: function() { clearInterval(timerId); },
      isDone: function() { return done; },
      getScore: function() { return score; },
      getCorrect: function() { return correct; }
    };
  }
  
  function loseLife() {
    lives--;
    localStorage.setItem("quizbattle_lives", lives);
    updateLivesDisplay();
    if (lives <= 0) {
      showBrick();
    } else {
      banner.innerHTML = '<div style="color:#e91e63;padding:15px;text-align:center;">💔 Жизнь потеряна! Осталось: ' + lives + ' жизней.</div>';
      banner.classList.add("show");
    }
  }
  
  function showBrick() {
    document.body.innerHTML = '<div class="brick"><div class="brick-inner"><h2>🚫 Страница заблокирована</h2><p>Это должно быть удалено</p><p>Жизни закончились (0/3)</p><button class="big-btn" onclick="location.reload()" style="margin-top:20px;">Обновить страницу</button></div></div>';
  }
  
  function startDinoGame() {
    var score = 0, timeLeft = 60;
    arena.innerHTML = '<div class="dino-game"><h2>🦖 Динозаврик: набери 1000 очков за 1 минуту!</h2><p id="dino-time" style="font-size:32px;color:#e91e63;">Время: 60 сек</p><p id="dino-score" style="font-size:28px;color:#4caf50;">Очки: 0 / 1000</p><div style="margin-top:20px;"><button class="dino-btn" onclick="window.answerDino(true)">Правильно ✓</button><button class="dino-btn" style="background:#e91e63;margin-left:10px;" onclick="answerDino(false)">Неправильно ✗</button></div></div>';
    var timeEl = document.getElementById("dino-time");
    var scoreEl = document.getElementById("dino-score");
    
    var interval = setInterval(function() {
      timeLeft--;
      document.getElementById("dino-time").textContent = "Время: " + timeLeft + " сек";
      if (timeLeft <= 0) { clearInterval(interval); endDinoGame(score); }
    }, 1000);
    
    window.answerDino = function(correct) {
      if (correct) { score += 100; document.getElementById("dino-score").textContent = "Очки: " + score + " / 1000"; }
    };
    
    function endDinoGame(finalScore) {
      delete window.answerDino;
      if (finalScore >= 1000) {
        arena.innerHTML = '<div class="dino-game"><h2>🏆 Победа! ' + finalScore + ' очков</h2><p>Динозаврик достиг цели! 🦖</p><button class="big-btn" onclick="location.reload()">Попробовать заново</button></div>';
      } else {
        arena.innerHTML = '<div class="dino-game"><h2>😅 Не успел: ' + finalScore + '/1000</h2><button class="big-btn" onclick="location.reload()">Попробовать снова</button></div>';
      }
    }
  }
  
  function startGame() {
    clearGame();
    var mode = settings.mode;
    if (mode === "solo") {
      var p = createPanel({ cls: "solo", timeLimit: settings.time, onFinish: handleFinish });
      panels.push(p); arena.appendChild(p.root);
    } else {
      var p1 = createPanel({ name: "Игрок 1", color: "#2196f3", timeLimit: settings.time, onFinish: checkDuel });
      var p2 = createPanel({ name: "Игрок 2", color: "#e91e63", timeLimit: settings.time, onFinish: checkDuel });
      panels.push(p1, p2); arena.appendChild(p1.root); arena.appendChild(el("div", "vs", "VS")); arena.appendChild(p2.root);
    }
    show("game");
  }
  
  function handleFinish(score, correct) {
    var p = panels[0];
    var correctCount = p.getCorrect();
    
    if (correctCount >= 3) {
      setTimeout(function() { startDinoGame(); }, 1500);
      return;
    }
    
    if (correctCount <= 2) {
      loseLife();
    }
  }
  
  var duelFinished = 0, duelResults = [];
  function checkDuel() {
    duelFinished++;
    if (duelFinished === 2) {
      var s1 = panels[0].getScore(), s2 = panels[1].getScore();
      var msg = s1 === s2 ? "🤝 Ничья! " + s1 + ":" + s2 : "🏆 Победил " + (s1>s2?"Игрок 1":"Игрок 2") + "! " + s1 + ":" + s2;
      banner.innerHTML = '<div style="padding:15px;text-align:center;">' + msg + '</div><button class="big-btn" onclick="startGame()">Реванш</button><button class="big-btn" style="background:#333;margin-top:10px;" onclick="toMenu()">Меню</button>';
      banner.classList.add("show");
      duelFinished = 0;
    }
  }
  
  function syncSetup() {
    rangeEl.value = settings.time; timeValueEl.textContent = fmtTime(settings.time);
    document.querySelectorAll(".chip").forEach(function(c) { c.classList.toggle("active", parseInt(c.dataset.sec) === settings.time); });
    $("btn-mode-solo").classList.toggle("active", settings.mode === "solo");
    $("btn-mode-duel").classList.toggle("active", settings.mode === "duel");
  }
  
  function buildPresets() {
    [5,10,20,30,60,120,300].forEach(function(sec) {
      var b = el("button", "chip", fmtTime(sec));
      b.type = "button"; b.dataset.sec = sec;
      b.addEventListener("click", function() { settings.time = sec; syncSetup(); });
      presetsBox.appendChild(b);
    });
  }
  
  rangeEl.addEventListener("input", function() { settings.time = Math.min(300, Math.max(5, parseInt(this.value)||30)); syncSetup(); });
  $("btn-mode-solo").addEventListener("click", function() { settings.mode = "solo"; syncSetup(); });
  $("btn-mode-duel").addEventListener("click", function() { settings.mode = "duel"; syncSetup(); });
  $("btn-start").addEventListener("click", startGame);
  $("btn-menu").addEventListener("click", toMenu);
  document.querySelectorAll(".mode-btn").forEach(function(b) { b.addEventListener("click", function() { settings.mode = this.id === "btn-mode-solo" ? "solo" : "duel"; syncSetup(); }); });
  
  buildPresets();
  syncSetup();
  updateLivesDisplay();
  
})();
</script>
</body>
</html>
